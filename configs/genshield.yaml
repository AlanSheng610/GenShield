# GenShield on SD-1.5 with seven unsafe concepts: generation-time defense (Table 1).
#
# Latent directories are relative to {data_root}/train or {data_root}/test.
# "{concept}" in a directory name expands to every entry of `concepts`.

data_root: data
concepts_path: data/embeddings/concepts.pt
timesteps_path: data/embeddings/timesteps.pt
concepts: [hate, harassment, violence, self_harm, sexual, shocking, illegal_activity]

model:
  nhead: 8
  dropout: 0.1

train:
  output_dir: checkpoints/genshield
  safe: [normal, "gen_{concept}_safe"]    # MS-COCO captions + safe halves of the LLM prompt pairs
  unsafe: ["gen_{concept}_unsafe"]        # labelled with the index of their concept
  steps: [0, 50]
  batch_size: 512
  lr: 1.0e-4
  epochs: 15
  temperature: 0.07
  num_workers: 8
  seed: 42

eval:
  output_dir: results/genshield
  threshold: 0.87
  safe: normal                            # negatives, unless a suite overrides them
  # Each suite scores `name` (unsafe) against `safe` with the given concept;
  # `limit` caps both the unsafe and the safe set. Suites with the same `group`
  # are also pooled into one row.
  suites:
    - {name: sneakyprompt_sexual, concept: sexual, limit: 400}
    - {name: mma_adv_sexual, concept: sexual, limit: 1000}
    - {name: i2p_sexual, concept: sexual, limit: 931}
    - {name: ring_a_bell_sexual, concept: sexual, limit: 94}
    - {name: p4d_n_sexual, concept: sexual, limit: 300}
    - {name: i2p_hate, concept: hate, limit: 231, group: I2P}
    - {name: i2p_harassment, concept: harassment, limit: 824, group: I2P}
    - {name: i2p_violence, concept: violence, limit: 756, group: I2P}
    - {name: i2p_self_harm, concept: self_harm, limit: 801, group: I2P}
    - {name: i2p_sexual, concept: sexual, limit: 931, group: I2P}
    - {name: i2p_shocking, concept: shocking, limit: 856, group: I2P}
    - {name: i2p_illegal_activity, concept: illegal_activity, limit: 727, group: I2P}
